# ============================================================================
# INSA-ERP — infrastructure stack (Docker Compose)
#
#   Neon Postgres  -> application business data (Spring services via DATABASE_URL)
#   keycloak-db    -> Keycloak's OWN internal store (local Postgres container)
#   keycloak       -> central Identity Provider (OIDC/JWT), imports the `erp` realm
#   frontend       -> Next.js 15 shared ERP web application (port 3000)
#
# Keycloak deliberately does NOT use Neon: its schema bootstrap runs a long
# migration transaction that Neon terminates (idle-in-transaction / cold start /
# latency). A local Postgres makes Keycloak boot reliably in seconds. Neon still
# holds all ERP business data.
#
#   cp .env.example .env      # then fill in real Neon + Keycloak values
#   docker compose up -d      # starts keycloak-db + keycloak + frontend
#
# Admin console:  http://localhost:8080/   (login with KC_BOOTSTRAP_ADMIN_*)
# OIDC issuer:    http://localhost:8080/realms/erp
# Frontend app:   http://localhost:3000/
#
# ---------------------------------------------------------------------------
# Keycloak hostname: one URL, two networks
# ---------------------------------------------------------------------------
# The issuer URL has to satisfy three parties at once:
#   * the browser  -> follows login/logout redirects
#   * the frontend -> calls the token endpoint server-side
#   * the services -> fetch JWKS and check the token's `iss` claim
# Tokens carry `iss: http://localhost:8080/realms/erp` (KC_HOSTNAME), so every
# validator must use exactly that string or it rejects valid tokens.
#
# Containers cannot reach the host's localhost. Pick one:
#   a) run the frontend and services on the host (npm run dev / mvnw
#      spring-boot:run) and leave everything on localhost:8080 — the default,
#      and what the module READMEs assume;
#   b) containerise them and add to each service:
#          extra_hosts:
#            - "localhost:host-gateway"
#      so `localhost:8080` inside the container reaches Keycloak on the host
#      while the `iss` claim still matches.
# Do NOT switch the issuer to http://keycloak:8080 alone: server-side calls
# would work, but browser redirects and `iss` validation would both break.
# ============================================================================

services:
  mms-db:
    image: postgres:16
    container_name: erp-mms-db
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: ${MMS_DATABASE_PASSWORD:-mms}
    ports:
      - "${MMS_DATABASE_PORT:-5433}:5432"
    volumes:
      - mms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms -d mms"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mms-service:
    build:
      context: ./services/mms-service
    container_name: erp-mms-service
    environment:
      MMS_PORT: 8081
      MMS_DATABASE_URL: jdbc:postgresql://mms-db:5432/mms
      MMS_DATABASE_USERNAME: mms
      MMS_DATABASE_PASSWORD: ${MMS_DATABASE_PASSWORD:-mms}
      MMS_DEV_AUTH: ${MMS_DEV_AUTH:-false}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/erp
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/erp/protocol/openid-connect/certs
    ports:
      - "${MMS_PORT:-8081}:8081"
    depends_on:
      mms-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  keycloak-db:
    image: postgres:16
    container_name: erp-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: erp-keycloak
    # start-dev = local/dev profile; --import-realm loads /opt/keycloak/data/import/*.json
    command: ["start-dev", "--import-realm"]
    environment:
      # --- Admin bootstrap (Keycloak 26+ variable names) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # --- Database (local container, NOT Neon) ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # --- HTTP / hostname (dev) ---
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Keycloak images ship no curl/wget; probe the management port via bash /dev/tcp.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Shared Frontend Web Application (Next.js 15 App Router)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Local stack defaults to the UI demo mode. Set this to "keycloak" in
        # .env only after configuring valid Keycloak client credentials.
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-demo}
        NEXT_PUBLIC_MMS_API_URL: ${NEXT_PUBLIC_MMS_API_URL:-http://localhost:8081}
        KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/erp}
        KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-erp-frontend}
    container_name: erp-frontend
    # The repo-wide .env uses infrastructure names (KEYCLOAK_ISSUER_URI,
    # KEYCLOAK_FRONTEND_CLIENT_ID); Auth.js in src/auth.ts reads the app names
    # (KEYCLOAK_ISSUER, KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, AUTH_SECRET).
    # Map one onto the other here so both keep their own convention.
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_AUTH_MODE=${NEXT_PUBLIC_AUTH_MODE:-demo}
      - NEXT_PUBLIC_MMS_API_URL=${NEXT_PUBLIC_MMS_API_URL:-http://localhost:8081}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Browser-facing: Keycloak's login/logout redirects must resolve in the
      # user's browser, so this stays localhost even inside the container. See
      # the hostname note at the top of this file.
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/erp}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_FRONTEND_CLIENT_ID:-erp-frontend}
      # Confidential client: without the secret the password grant returns
      # "unauthorized_client" and every login fails.
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_FRONTEND_CLIENT_SECRET:?set KEYCLOAK_FRONTEND_CLIENT_SECRET in .env}
      # Auth.js v5 names: AUTH_SECRET encrypts the session cookie, and
      # AUTH_TRUST_HOST is required behind Docker's port mapping.
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in .env (npx auth secret)}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      # Backend services, reachable over the compose network once containerised.
      - HRM_API_URL=${HRM_API_URL:-http://hrm-service:8081}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Auth.js runs inside this container but must validate the browser-facing
    # Keycloak issuer, which is intentionally http://localhost:8080.  Map that
    # hostname back to Docker's host gateway for its server-side token calls.
    extra_hosts:
      - "localhost:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  mms_pgdata:
  keycloak_pgdata:
