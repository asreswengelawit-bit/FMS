# ============================================================================
# INSA-ERP — infrastructure stack (Docker Compose)
#
#   Neon Postgres  -> application business data (Spring services via DATABASE_URL)
#   keycloak-db    -> Keycloak's OWN internal store (local Postgres container)
#   keycloak       -> central Identity Provider (OIDC/JWT), imports the `erp` realm
#   frontend       -> Next.js 15 shared ERP web application (port 3000)
#
# Keycloak deliberately does NOT use Neon: its schema bootstrap runs a long
# migration transaction that Neon terminates (idle-in-transaction / cold start /
# latency). A local Postgres makes Keycloak boot reliably in seconds. Neon still
# holds all ERP business data.
#
#   cp .env.example .env      # then fill in real Neon + Keycloak values
#   docker compose up -d      # starts keycloak-db + keycloak + frontend
#
# Admin console:  http://localhost:8080/   (login with KC_BOOTSTRAP_ADMIN_*)
# OIDC issuer:    http://localhost:8080/realms/erp
# Frontend app:   http://localhost:3000/
#
# ---------------------------------------------------------------------------
# Keycloak hostname: one URL, two networks
# ---------------------------------------------------------------------------
# The issuer URL has to satisfy three parties at once:
#   * the browser  -> follows login/logout redirects
#   * the frontend -> calls the token endpoint server-side
#   * the services -> fetch JWKS and check the token's `iss` claim
# Tokens carry `iss: http://localhost:8080/realms/erp` (KC_HOSTNAME), so every
# validator must use exactly that string or it rejects valid tokens.
#
# Containers cannot reach the host's localhost. Pick one:
#   a) run the frontend and services on the host (npm run dev / mvnw
#      spring-boot:run) and leave everything on localhost:8080 — the default,
#      and what the module READMEs assume;
#   b) containerise them and add to each service:
#          extra_hosts:
#            - "localhost:host-gateway"
#      so `localhost:8080` inside the container reaches Keycloak on the host
#      while the `iss` claim still matches.
# Do NOT switch the issuer to http://keycloak:8080 alone: server-side calls
# would work, but browser redirects and `iss` validation would both break.
#
# ---------------------------------------------------------------------------
# Local Postgres fallback (no Neon)
# ---------------------------------------------------------------------------
# Each module can also run against a plain container Postgres instead of Neon.
# The `*-db` services below map to each Spring service's default datasource so
# host-run services work with zero extra config (the rest of the stack, e.g.
# keycloak, rabbitmq, frontend, is unchanged):
#
#   hrm   jdbc:postgresql://localhost:5431/hrm?currentSchema=hrm_schema  (hrm/hrm)
#         -> hrm only reads DATABASE_URL (see DatabaseUrlEnvironmentPostProcessor);
#            point it at the line above when not using Neon.
#   prms  jdbc:postgresql://localhost:5435/prms  (postgres/postgres)
#         -> 5432 is the module's code default but is usually taken by a local
#            Postgres / legacy stack; point PRMS at the compose DB with
#            POSTGRES_PORT=5435 when running it on the host.
#   mms   jdbc:postgresql://localhost:5433/mms   (mms/mms)
#   fms   jdbc:postgresql://localhost:5434/fms   (fms/fms)
#   crm   jdbc:postgresql://localhost:5436/crm   (crm/crm)
#         -> crm reads DB_URL and needs an application.properties copied from
#            src/main/resources/application.properties.example.
#
# Demo-mode auth: FMS ships with dev-auth on (FMS_DEV_AUTH=true default) and HRM
# has hrm.security.enabled=false, so the UI can read/write without Keycloak. MMS
# ships with dev-auth OFF (MMS_DEV_AUTH=false) — set MMS_DEV_AUTH=true to let the
# demo-mode UI write. PRMS/CRM always validate JWTs against Keycloak.
# ============================================================================

services:
  mms-db:
    image: postgres:16
    container_name: erp-mms-db
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: ${MMS_DATABASE_PASSWORD:-mms}
    ports:
      - "${MMS_DATABASE_PORT:-5433}:5432"
    volumes:
      - mms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms -d mms"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mms-service:
    build:
      context: ./services/mms-service
    container_name: erp-mms-service
    environment:
      MMS_PORT: 8081
      MMS_DATABASE_URL: jdbc:postgresql://mms-db:5432/mms
      MMS_DATABASE_USERNAME: mms
      MMS_DATABASE_PASSWORD: ${MMS_DATABASE_PASSWORD:-mms}
      MMS_DEV_AUTH: ${MMS_DEV_AUTH:-false}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/erp
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/erp/protocol/openid-connect/certs
    ports:
      - "${MMS_PORT:-8081}:8081"
    depends_on:
      mms-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  hrm-db:
    image: postgres:16
    container_name: erp-hrm-db
    environment:
      POSTGRES_DB: hrm
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: ${HRM_DATABASE_PASSWORD:-hrm}
    ports:
      - "${HRM_DATABASE_PORT:-5431}:5432"
    volumes:
      - hrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm -d hrm"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prms-db:
    image: postgres:16
    container_name: erp-prms-db
    environment:
      POSTGRES_DB: prms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRMS_DATABASE_PASSWORD:-postgres}
    ports:
      - "${PRMS_DATABASE_PORT:-5435}:5432"
    volumes:
      - prms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prms"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fms-db:
    image: postgres:16
    container_name: erp-fms-db
    environment:
      POSTGRES_DB: fms
      POSTGRES_USER: fms
      POSTGRES_PASSWORD: ${FMS_DATABASE_PASSWORD:-fms}
    ports:
      - "${FMS_DATABASE_PORT:-5434}:5432"
    volumes:
      - fms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fms -d fms"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  crm-db:
    image: postgres:16
    container_name: erp-crm-db
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${CRM_DATABASE_PASSWORD:-crm}
    ports:
      - "${CRM_DATABASE_PORT:-5436}:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak-db:
    image: postgres:16
    container_name: erp-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: erp-keycloak
    # start-dev = local/dev profile; --import-realm loads /opt/keycloak/data/import/*.json
    command: ["start-dev", "--import-realm"]
    environment:
      # --- Admin bootstrap (Keycloak 26+ variable names) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # --- Database (local container, NOT Neon) ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # --- HTTP / hostname (dev) ---
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Keycloak images ship no curl/wget; probe the management port via bash /dev/tcp.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # RabbitMQ — event bus for the microservices (CRM, PRMS)
  # ----------------------------------------------------------------------------
  # Spring AMQP clients reach this broker at `rabbitmq:5672` from within the
  # compose network. The host ports (5672 AMQP, 15672 management UI) are the
  # same values PRMS/CRM use by default when run on the host.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: erp-rabbitmq
    hostname: erp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Shared Frontend Web Application (Next.js 15 App Router)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Local stack defaults to the UI demo mode. Set this to "keycloak" in
        # .env only after configuring valid Keycloak client credentials.
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-demo}
        NEXT_PUBLIC_MMS_API_URL: ${NEXT_PUBLIC_MMS_API_URL:-http://localhost:8081}
        KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/erp}
        KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-erp-frontend}
    container_name: erp-frontend
    # The repo-wide .env uses infrastructure names (KEYCLOAK_ISSUER_URI,
    # KEYCLOAK_FRONTEND_CLIENT_ID); Auth.js in src/auth.ts reads the app names
    # (KEYCLOAK_ISSUER, KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, AUTH_SECRET).
    # Map one onto the other here so both keep their own convention.
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_AUTH_MODE=${NEXT_PUBLIC_AUTH_MODE:-demo}
      - NEXT_PUBLIC_MMS_API_URL=${NEXT_PUBLIC_MMS_API_URL:-http://localhost:8081}
      - NEXT_PUBLIC_FMS_API_URL=${NEXT_PUBLIC_FMS_API_URL:-http://localhost:8084}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Browser-facing: Keycloak's login/logout redirects must resolve in the
      # user's browser, so this stays localhost even inside the container. See
      # the hostname note at the top of this file.
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/erp}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_FRONTEND_CLIENT_ID:-erp-frontend}
      # Confidential client: without the secret the password grant returns
      # "unauthorized_client" and every login fails.
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_FRONTEND_CLIENT_SECRET:?set KEYCLOAK_FRONTEND_CLIENT_SECRET in .env}
      # Auth.js v5 names: AUTH_SECRET encrypts the session cookie, and
      # AUTH_TRUST_HOST is required behind Docker's port mapping.
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in .env (npx auth secret)}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      # Backend services, reachable over the compose network once containerised.
      - HRM_API_URL=${HRM_API_URL:-http://hrm-service:8081}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Auth.js runs inside this container but must validate the browser-facing
    # Keycloak issuer, which is intentionally http://localhost:8080.  Map that
    # hostname back to Docker's host gateway for its server-side token calls.
    extra_hosts:
      - "localhost:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  hrm_pgdata:
  prms_pgdata:
  mms_pgdata:
  fms_pgdata:
  crm_pgdata:
  keycloak_pgdata:
  rabbitmq_data:
