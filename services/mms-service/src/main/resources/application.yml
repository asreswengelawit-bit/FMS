server:
  port: ${MMS_PORT:8081}

spring:
  application:
    name: mms-service
  datasource:
    url: ${MMS_DATABASE_URL:jdbc:postgresql://localhost:5433/mms}
    username: ${MMS_DATABASE_USERNAME:mms}
    password: ${MMS_DATABASE_PASSWORD:mms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/erp}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/erp/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.company.mms: INFO
