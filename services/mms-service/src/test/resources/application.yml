spring:
  datasource:
    url: jdbc:h2:mem:mms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/erp
          jwk-set-uri: http://localhost:8080/realms/erp/protocol/openid-connect/certs
