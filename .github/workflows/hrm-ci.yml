# HRM module CI (owned by Team 1 — README §1).
# Runs on anything that touches the HRM service; the tests spin up Postgres via
# Testcontainers, apply every Flyway migration and let Hibernate validate the
# entity mappings against them.
name: hrm-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/hrm-service/**'
      - '.github/workflows/hrm-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'services/hrm-service/**'
      - '.github/workflows/hrm-ci.yml'
  workflow_dispatch:

concurrency:
  group: hrm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hrm-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrm-test-results
          path: services/hrm-service/target/surefire-reports
          if-no-files-found: ignore
